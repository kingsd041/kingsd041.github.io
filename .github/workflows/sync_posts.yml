name: Auto Sync Posts to Rancher Forum

on:
  push:
    paths:
      # 1. 只有修改或新增这 7 个指定目录下的 .md 时才触发 Action
      - '_posts/harvester/**/*.md'
      - '_posts/k3s/**/*.md'
      - '_posts/longhorn/**/*.md'
      - '_posts/neuvector/**/*.md'
      - '_posts/rancher/**/*.md'
      - '_posts/rancherdesktop/**/*.md'
      - '_posts/rke2/**/*.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: pip install requests pyyaml

      - name: Get Added Markdown Files
        id: changed-files
        run: |
          # 2. 使用 ERE (Extended Regex) 仅筛选指定 7 个目录中新增的 .md 文件
          FILES=$(git diff --name-only --diff-filter=A HEAD~1 HEAD | grep -E '^_posts/(harvester|k3s|longhorn|neuvector|rancher|rancherdesktop|rke2)/.*\.md$' || true)
          
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Sync Posts to Rancher Forum
        env:
          RANCHER_FORUM_API_KEY: ${{ secrets.RANCHER_FORUM_API_KEY }}
          RANCHER_FORUM_USER: ${{ secrets.RANCHER_FORUM_USER }}
          RANCHER_FORUM_CATEGORY: ${{ secrets.RANCHER_FORUM_CATEGORY }}
        run: |
          FILES="${{ steps.changed-files.outputs.files }}"
          if [ -z "$FILES" ]; then
            echo "本次提交未包含指定 7 个产品目录中的新增文章，跳过同步。"
          else
            echo "检测到符合条件的新增文章:"
            echo "$FILES"
            for file in $FILES; do
              if [ -f "$file" ]; then
                echo "正在发布: $file"
                python sync_to_forum.py "$file"
              fi
            done
          fi
